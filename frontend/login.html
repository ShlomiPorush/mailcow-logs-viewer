<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Login - mailcow Logs Viewer</title>
    
    <!-- App icons -->
    <link rel="icon" href="/static/assets/icons/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/static/assets/icons/app-icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/assets/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/assets/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#0f172a">
    
    <style>.hidden{display:none}</style>
    <link rel="stylesheet" href="/static/assets/css/utilities.css?v=1">
    <link rel="stylesheet" href="/static/assets/css/ui.css?v=27">
    <style>
        .loading {
            border: 3px solid var(--ui-line);
            border-top: 3px solid var(--ui-accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="ui-login">
    <div class="ui-panel ui-login-card">
        <div class="ui-login-head">
            <img id="app-logo" src="" alt="" class="ui-login-logo hidden">
            <img id="default-logo" src="/static/assets/icons/app-icon.svg" alt="" class="ui-login-logo">
            <h1 id="app-title" class="ui-h1">mailcow Logs Viewer</h1>
            <p class="ui-muted">Please enter your credentials to continue</p>
        </div>
        
        <!-- Why the last session ended (?reason=), above both sign-in methods -->
        <div id="login-notice" class="hidden ui-banner ui-banner-warn ui-login-notice" role="status">
            <span id="login-notice-text"></span>
        </div>

        <!-- OAuth2 Login Section -->
        <div id="oauth2-section" class="hidden ui-login-oauth">
            <button 
                type="button"
                id="oauth2-login-btn"
                onclick="handleOAuth2Login()"
                class="ui-btn ui-btn-primary ui-btn-block"
            >
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
                <span id="oauth2-login-text">Login with <span id="oauth2-provider-name">OAuth2</span></span>
            </button>
        </div>
        
        <!-- OR Separator (only shown when both OAuth2 and Basic Auth are available) -->
        <div id="auth-separator" class="hidden ui-login-or">
            <div class="ui-login-or-rule">
                <div class="ui-login-or-line"></div>
            </div>
            <div class="ui-login-or-text">
                <span>OR</span>
            </div>
        </div>
        
        <!-- Basic Auth Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)" class="ui-login-form">
            <div id="login-error" class="hidden ui-banner ui-banner-fail" role="alert">
                <span id="login-error-text"></span>
            </div>
            
            <div>
                <label for="login-username" class="ui-label">
                    Username
                </label>
                <input 
                    type="text" 
                    id="login-username" 
                    required
                    autocomplete="username"
                    class="ui-input"
                    placeholder="Enter username"
                    autofocus
                >
            </div>
            
            <div>
                <label for="login-password" class="ui-label">
                    Password
                </label>
                <div class="ui-pass">
                <input 
                    type="password" 
                    id="login-password" 
                    required
                    autocomplete="current-password"
                    class="ui-input"
                    placeholder="Enter password"
                    aria-describedby="login-caps"
                >
                <button type="button" id="login-show-password" class="ui-pass-toggle" aria-label="Show password" aria-pressed="false" title="Show password" onclick="togglePasswordShown()">
                    <svg class="ui-pass-show" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    <svg class="ui-pass-hide" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
                </button>
                </div>
                <p id="login-caps" class="ui-caps hidden">Caps Lock is on</p>
            </div>
            
            <button 
                type="submit" 
                id="login-submit"
                class="ui-btn ui-btn-primary ui-btn-block"
            >
                <span id="login-submit-text">Sign In</span>
                <span id="login-submit-loading" class="hidden">
                    <svg class="ui-spin" width="16" height="16" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Signing in...
                </span>
            </button>
        </form>
    </div>

    <script>
        // Initialize dark mode
        function initDarkMode() {
            const theme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (theme === 'dark' || (!theme && prefersDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }
        
        // Initialize dark mode immediately
        initDarkMode();

        // The page asked for before signing in (?next=), checked the same way as
        // the server's safe_return_path: only a local path, never another site.
        // What is returned is rebuilt from the parsed address on this site's
        // origin, never the value as given.
        function safeReturnPath(value) {
            if (!value || value.length > 2048 || !value.startsWith('/') || value.startsWith('//')
                || /[\\\x00-\x1f\x7f]/.test(value)) return '/';
            let url;
            try {
                url = new URL(value, window.location.origin);
            } catch (e) {
                return '/';
            }
            if (url.origin !== window.location.origin) return '/';
            if (url.pathname === '/login' || /^\/(login|api|static)\//.test(url.pathname)) return '/';
            // Checked again as rebuilt: removing dot segments turns /.//host into
            // //host, which the browser reads as another site
            const path = url.pathname + url.search + url.hash;
            if (path.startsWith('//') || path.includes('\\')) return '/';
            return path;
        }
        const returnTo = safeReturnPath(new URLSearchParams(window.location.search).get('next'));
        
        // The credentials are used once, here, to obtain a session cookie.
        // Nothing about them is kept in the browser: the cookie the backend
        // sets is HttpOnly, so no script on the page (or injected into it) can
        // read it, and there is no password in sessionStorage to steal.
        async function startSession(username, password) {
            const response = await fetch('/api/auth/session', {
                method: 'POST',
                credentials: 'include',
                headers: {
                    'Authorization': `Basic ${btoa(`${username}:${password}`)}`
                }
            });
            return response;
        }

        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('login-error');
            const errorText = document.getElementById('login-error-text');
            const submitBtn = document.getElementById('login-submit');
            const submitText = document.getElementById('login-submit-text');
            const submitLoading = document.getElementById('login-submit-loading');
            
            // Hide error
            if (errorDiv) errorDiv.classList.add('hidden');
            
            // Show loading
            if (submitText) submitText.classList.add('hidden');
            if (submitLoading) submitLoading.classList.remove('hidden');
            if (submitBtn) submitBtn.disabled = true;
            
            try {
                const response = await startSession(username, password);
                if (response.ok) {
                    // Success - redirect to main app using replace to avoid loop
                    window.location.replace(returnTo);
                } else {
                    const message = response.status === 429
                        ? 'Too many login attempts. Please try again later.'
                        : response.status === 503
                            ? 'Login capacity reached. Please try again later.'
                            : response.status === 409
                                ? 'Sign-in settings just changed. Please sign in again.'
                                : response.status === 401
                                    ? 'Invalid username or password'
                                    : 'Unable to sign in. Please try again later.';
                    const error = new Error(message);
                    error.loginResponse = true;
                    throw error;
                }
            } catch (error) {
                // Show error (always show user-friendly message for failed login)
                if (errorDiv) {
                    errorDiv.classList.remove('hidden');
                    if (errorText) {
                        errorText.textContent = error.loginResponse
                            ? error.message : 'Unable to connect. Check your connection and try again.';
                    }
                }
                
                // Clear password field
                const passwordField = document.getElementById('login-password');
                if (passwordField) passwordField.value = '';
            } finally {
                // Hide loading
                if (submitText) submitText.classList.remove('hidden');
                if (submitLoading) submitLoading.classList.add('hidden');
                if (submitBtn) submitBtn.disabled = false;
            }
        }

        // The password in plain text while the button is pressed
        function togglePasswordShown() {
            const field = document.getElementById('login-password');
            const button = document.getElementById('login-show-password');
            const shown = field.type === 'password';
            field.type = shown ? 'text' : 'password';
            button.setAttribute('aria-pressed', String(shown));
            button.title = shown ? 'Hide password' : 'Show password';
            field.focus();
        }

        // A note under the password while Caps Lock is on. Only key and mouse
        // events know the key's state; leaving the field hides the note
        function showCapsLock(event) {
            if (typeof event.getModifierState !== 'function') return;
            document.getElementById('login-caps').classList.toggle('hidden', !event.getModifierState('CapsLock'));
        }
        (function watchCapsLock() {
            const field = document.getElementById('login-password');
            if (!field) return;
            ['keydown', 'keyup', 'mousedown'].forEach(type => field.addEventListener(type, showCapsLock));
            field.addEventListener('blur', () => document.getElementById('login-caps').classList.add('hidden'));
        })();

        // OAuth2 login handler
        function handleOAuth2Login() {
            window.location.href = '/api/auth/login' + (returnTo !== '/' ? `?next=${encodeURIComponent(returnTo)}` : '');
        }
        
        // Check for OAuth2 callback errors
        function checkForErrors() {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            if (error) {
                const errorDiv = document.getElementById('login-error');
                const errorText = document.getElementById('login-error-text');
                if (errorDiv && errorText) {
                    let errorMessage = 'Authentication failed';
                    switch(error) {
                        case 'oauth2_error':
                            errorMessage = 'OAuth2 authentication failed. Please try again.';
                            break;
                        case 'invalid_state':
                            errorMessage = 'Invalid authentication state. Please try again.';
                            break;
                        case 'missing_code':
                            errorMessage = 'Authentication code missing. Please try again.';
                            break;
                        case 'no_token':
                            errorMessage = 'Failed to obtain access token. Please try again.';
                            break;
                        case 'session_capacity':
                            errorMessage = 'Login capacity reached. Please try again later.';
                            break;
                        case 'sign_in_changed':
                            errorMessage = 'Sign-in settings just changed. Please sign in again.';
                            break;
                        case 'server_error':
                            errorMessage = 'Server error during authentication. Please try again.';
                            break;
                    }
                    errorText.textContent = errorMessage;
                    errorDiv.classList.remove('hidden');
                }
                // Clean up URL
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }
        
        // Why the last session ended (?reason=, from session-guard.js and the
        // server). Only known reasons are shown, never the value as given; the
        // reason leaves the address, ?next= stays
        function showSignOutReason() {
            const urlParams = new URLSearchParams(window.location.search);
            if (!urlParams.has('reason')) return;
            let message = '';
            switch (urlParams.get('reason')) {
                case 'session_idle':
                    message = 'You were signed out because there was no activity. Sign in again to continue.';
                    break;
                case 'session_expired':
                    message = 'Your session reached its maximum length. Sign in again to continue.';
                    break;
            }
            if (message) {
                document.getElementById('login-notice-text').textContent = message;
                document.getElementById('login-notice').classList.remove('hidden');
            }
            urlParams.delete('reason');
            const rest = urlParams.toString();
            window.history.replaceState({}, document.title, window.location.pathname + (rest ? `?${rest}` : ''));
        }

        // Load app title and configure login options on page load
        document.addEventListener('DOMContentLoaded', async () => {
            // Check for errors first
            showSignOutReason();
            checkForErrors();
            
            // First check if authentication is enabled
            try {
                const infoResponse = await fetch('/api/info');
                if (infoResponse.ok) {
                    const infoData = await infoResponse.json();
                    // If authentication is disabled, redirect to main app
                    if (!infoData.auth_enabled) {
                        window.location.replace(returnTo);
                        return;
                    }
                }
            } catch (e) {
                // If we can't check, assume auth is enabled for safety
                console.warn('Could not check auth status, assuming enabled');
            }
            
            // Check authentication provider info
            let oauth2Enabled = false;
            let basicAuthEnabled = false;
            
            try {
                const providerResponse = await fetch('/api/auth/provider-info');
                if (providerResponse.ok) {
                    const providerData = await providerResponse.json();
                    oauth2Enabled = providerData.oauth2_enabled || false;
                    basicAuthEnabled = providerData.basic_auth_enabled || false;
                    
                    // Show OAuth2 section if enabled
                    if (oauth2Enabled) {
                        const oauth2Section = document.getElementById('oauth2-section');
                        if (oauth2Section) {
                            oauth2Section.classList.remove('hidden');
                        }
                        
                        // Update provider name
                        const providerNameEl = document.getElementById('oauth2-provider-name');
                        if (providerNameEl && providerData.provider_name) {
                            providerNameEl.textContent = providerData.provider_name;
                        }
                    }
                    
                    // Hide Basic Auth form if not enabled
                    if (!basicAuthEnabled) {
                        const loginForm = document.getElementById('login-form');
                        if (loginForm) {
                            loginForm.classList.add('hidden');
                        }
                    }
                }
            } catch (e) {
                console.warn('Could not fetch authentication provider info:', e);
                // Fallback: assume Basic Auth is available if we can't check
                basicAuthEnabled = true;
            }
            
            // Show OR separator only if both OAuth2 and Basic Auth are available
            if (oauth2Enabled && basicAuthEnabled) {
                const separator = document.getElementById('auth-separator');
                if (separator) {
                    separator.classList.remove('hidden');
                }
            }
            
            // Already signed in? Both login methods end up with a session cookie.
            try {
                const statusResponse = await fetch('/api/auth/status', { credentials: 'include' });
                if (statusResponse.ok) {
                    const statusData = await statusResponse.json();
                    if (statusData.authenticated) {
                        window.location.replace(returnTo);
                        return;
                    }
                }
            } catch (e) {
                // Not authenticated, continue
            }
            
            // Load app branding
            try {
                const response = await fetch('/api/info');
                if (response.ok) {
                    const data = await response.json();
                    if (data.app_title) {
                        document.getElementById('app-title').textContent = data.app_title;
                        document.title = `Login - ${data.app_title}`;
                    }
                    if (data.app_logo_url) {
                        const logoImg = document.getElementById('app-logo');
                        logoImg.src = data.app_logo_url;
                        logoImg.classList.remove('hidden');
                        document.getElementById('default-logo').classList.add('hidden');
                    }
                }
            } catch (e) {
                // Ignore errors
            }
        });
    </script>
</body>
</html>
