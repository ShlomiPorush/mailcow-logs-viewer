# Alembic configuration for mailcow-logs-viewer
#
# The database URL is NOT set here - env.py reads it from the application
# settings (POSTGRES_* environment variables), the same way the app does.
#
# Usage (inside the container or from backend/ with env vars set):
#   alembic current                      show current revision
#   alembic upgrade head                 apply pending migrations
#   alembic revision -m "description"    create a new empty revision
#   alembic revision --autogenerate -m "description"
#     (autogenerate diffs against app/models.py - ALWAYS review the output;
#      pre-Alembic installs have legacy indexes/constraints not in models)

[alembic]
# %(here)s = directory containing this file, so the CLI works from any cwd
script_location = %(here)s/alembic
prepend_sys_path = %(here)s

# Template for new revision files: 0002_short_description.py
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
