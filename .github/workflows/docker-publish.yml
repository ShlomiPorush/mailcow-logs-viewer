name: Build and Publish Docker Image

on:
  push:
    tags: [ 'v*.*.*' ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/docker-publish.yml'

env:
  GH_REGISTRY: ghcr.io
  DOCKER_HUB_REPO: shlomip/mailcow-logs-viewer

jobs:
  # The image is only published when CI passes on the tagged commit.
  # A broken release must never reach ghcr.io / Docker Hub as `latest`.
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GH_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GH_REGISTRY }}/${{ github.repository }}
            ${{ env.DOCKER_HUB_REPO }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The release notes are the changelog section for this version, so a release
  # can never describe something the changelog does not. Runs after the image is
  # pushed: no release without an image behind it.
  publish-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Publish the GitHub release from the changelog
        run: |
          VERSION="${TAG#v}"
          awk -v want="## [${VERSION}]" '
            index($0, want) == 1 { inside = 1; print; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section - refusing to publish a release with an empty body"
            exit 1
          fi
          echo "Release notes ($(wc -l < notes.md) lines):"
          cat notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists - updating its notes"
            gh release edit "$TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" --title "$VERSION" --notes-file notes.md --latest
          fi

  # Issues with a merged fix stay open until the release that ships it.
  # Once the image is published, close every open issue labelled
  # `fix available` (the label is applied only after the fix is merged to
  # main, so everything it marks is in this release).
  close-shipped-issues:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Close issues labelled "fix available"
        run: |
          issues=$(gh issue list --state open --label "fix available" --limit 100 --json number -q '.[].number')
          if [ -z "$issues" ]; then
            echo "No open issues labelled 'fix available'."
            exit 0
          fi
          for n in $issues; do
            gh issue comment "$n" --body "Shipped in ${TAG}."
            gh issue close "$n" --reason completed
            echo "closed #$n"
          done
