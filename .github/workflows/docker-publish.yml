name: Build and Publish Docker Image

on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/docker-publish.yml'

env:
  GH_REGISTRY: ghcr.io
  DOCKER_HUB_REPO: shlomip/mailcow-logs-viewer

jobs:
  # The image is only published when CI passes on the tagged commit.
  # A broken release must never reach ghcr.io / Docker Hub as `latest`.
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: checks
    runs-on: ubuntu-latest
    # A second run for the same tag waits, then finds the version published.
    concurrency:
      group: publish-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GH_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # A published version tag never moves: a re-run of a release that already
      # reached a registry stops here. `latest` must answer first, so a failed
      # lookup can never pass as "not published".
      - name: Refuse to push a published version again
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json'
          manifest_status() {
            curl -sS -o /dev/null -w '%{http_code}' -I -H "Authorization: Bearer $1" -H "Accept: $ACCEPT" "$2/manifests/$3"
          }
          refuse_published_version() {
            local image=$1 token_url=$2 registry_repo=$3 token
            if ! token=$(curl -fsS "$token_url" | jq -er .token); then
              echo "::error::Could not get a read token for $image"
              exit 1
            fi
            if [ "$(manifest_status "$token" "$registry_repo" latest)" != 200 ]; then
              echo "::error::Could not read $image:latest, so whether $image:$VERSION exists is unknown"
              exit 1
            fi
            case "$(manifest_status "$token" "$registry_repo" "$VERSION")" in
              404) echo "$image:$VERSION is not published yet" ;;
              200) echo "::error::$image:$VERSION is already published, and a published version is never pushed again"; exit 1 ;;
              *) echo "::error::Could not check whether $image:$VERSION exists"; exit 1 ;;
            esac
          }
          GHCR_REPO="${GITHUB_REPOSITORY,,}"
          refuse_published_version "ghcr.io/$GHCR_REPO" \
            "https://ghcr.io/token?scope=repository:$GHCR_REPO:pull" \
            "https://ghcr.io/v2/$GHCR_REPO"
          refuse_published_version "docker.io/$DOCKER_HUB_REPO" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$DOCKER_HUB_REPO:pull" \
            "https://registry-1.docker.io/v2/$DOCKER_HUB_REPO"

      # Rollout labels, see documentation/Deployment.md. rollout-from is the
      # version being published: two instances of the app cannot run side by
      # side yet, so every release is updated with a short downtime.
      - name: Rollout label values
        id: rollout
        run: |
          echo "compose_sha256=$(sha256sum docker-compose.yml | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "rollout_from=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GH_REGISTRY }}/${{ github.repository }}
            ${{ env.DOCKER_HUB_REPO }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            mailcow-logs-viewer.compose-sha256=${{ steps.rollout.outputs.compose_sha256 }}
            mailcow-logs-viewer.rollout-from=${{ steps.rollout.outputs.rollout_from }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The release notes are the changelog section for this version, so a release
  # can never describe something the changelog does not. Runs after the image is
  # pushed: no release without an image behind it.
  publish-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Publish the GitHub release from the changelog
        run: |
          VERSION="${TAG#v}"
          awk -v want="## [${VERSION}]" '
            index($0, want) == 1 { inside = 1; print; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section - refusing to publish a release with an empty body"
            exit 1
          fi
          echo "Release notes ($(wc -l < notes.md) lines):"
          cat notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists - updating its notes"
            gh release edit "$TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" --title "$VERSION" --notes-file notes.md --latest
          fi

  # Issues with a merged fix stay open until the release that ships it.
  # Once the image is published, close every open issue labelled
  # `fix available` (the label is applied only after the fix is merged to
  # main, so everything it marks is in a release tagged on main). A release
  # tagged on a maintenance branch (an urgent fix to an earlier version while
  # main has moved on) does not carry main's fixes, so it closes nothing;
  # close the issues it fixes by hand.
  close-shipped-issues:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Close issues labelled "fix available"
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::notice::${TAG} is not on main, so it does not ship main's fixes. No issue was closed; close the ones this release fixes by hand."
            exit 0
          fi
          issues=$(gh issue list --state open --label "fix available" --limit 100 --json number -q '.[].number')
          if [ -z "$issues" ]; then
            echo "No open issues labelled 'fix available'."
            exit 0
          fi
          for n in $issues; do
            gh issue comment "$n" --body "Shipped in ${TAG}."
            gh issue close "$n" --reason completed
            echo "closed #$n"
          done
