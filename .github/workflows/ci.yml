# CI: runs on every pull request and, via workflow_call, in front of the
# image publish on version tags (see docker-publish.yml). It does not run
# on pushes to main: main only changes through merged PRs and releases,
# and both of those are already covered.
#
# Five jobs, each catching a different class of failure:
#   lock-files      the hash-pinned Python lock files still match the
#                   requirements*.in files they are generated from
#                   (.github/scripts/lock-requirements.sh --check).
#   backend-tests   unit + database tests against a real PostgreSQL. A test
#                   that skips for lack of a database is treated as a failure,
#                   so the suite cannot quietly go green by skipping.
#                   Dependencies come from the lock file, hash-checked.
#   frontend-syntax node --check over every frontend script (no build step),
#                   the frontend tests, and the pickers checked for keyboard,
#                   focus and ARIA in a real DOM with axe-core.
#   image-smoke     builds the Docker image and boots it against PostgreSQL:
#                   health, SPA, static assets, Alembic head, and the manual
#                   job runner accepting every job the Status page lists
#                   (.github/scripts/smoke.sh).
#   demo-smoke      builds the public demo image and boots it with nothing but
#                   database settings (.github/scripts/demo_smoke.sh).
#
# Every action is pinned to a commit SHA and every image to a digest, with the
# version in a comment; the Node tools come from .github/node-tools with its
# package-lock.json. Dependabot moves the actions, the Dockerfile base image
# and the Python and Node packages (.github/dependabot.yml). The images started
# by `docker run` (PostgreSQL here and in the smoke scripts, Node in
# build-utilities-css.sh) are outside its reach and are moved by hand.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# Least privilege for every job in this workflow; nothing here writes to the
# repository. A job that needs more must ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lock-files:
    name: Lock files match their inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same uv version as lock-requirements.sh, so the check regenerates
      # exactly what a contributor generates locally. The download is verified
      # against the SHA-256 published with the uv release.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          checksum: bf65ac1a0af10f92c522d91ac096c7c0a39657647b155577e7836c2cbbb4526c
          require-checksums: true
          enable-cache: false

      - name: Check the requirements*.txt lock files against their .in files
        run: bash .github/scripts/lock-requirements.sh --check

  backend-tests:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    # The tests generate their own mailcow API key (backend/tests/conftest.py)
    env:
      MAILCOW_URL: https://mail.example.com
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ci
      POSTGRES_DB: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Started here rather than as a service container: a service cannot take
      # a value generated during the run, and the password is new for each run
      - name: Start PostgreSQL
        run: |
          password="$(openssl rand -hex 32)"
          echo "::add-mask::${password}"
          export POSTGRES_PASSWORD="${password}"
          docker run -d --name ci-postgres -p 5432:5432 \
            -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB \
            postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d >/dev/null
          # Over TCP: during initialisation the server listens on its socket only
          for i in $(seq 1 60); do
            if docker exec ci-postgres pg_isready -h 127.0.0.1 -U ci -q; then break; fi
            [ "$i" -eq 60 ] && { echo "::error::PostgreSQL did not become ready"; docker logs ci-postgres; exit 1; }
            sleep 1
          done
          echo "POSTGRES_PASSWORD=${password}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # The same flags as the Dockerfile: only what the lock file pins, only
      # with a matching hash, only from wheels.
      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check \
            --require-hashes --no-deps --only-binary=:all: \
            -r backend/requirements-dev.txt
          pip check

      - name: Run tests
        working-directory: backend
        run: |
          set -o pipefail
          python -m pytest -q -rs -p no:warnings 2>&1 | tee pytest.log

      - name: Fail if any test skipped for lack of a database
        working-directory: backend
        run: |
          if grep -q "PostgreSQL not available" pytest.log; then
            echo "::error::tests skipped because PostgreSQL was not reachable; the database service is misconfigured"
            grep "PostgreSQL not available" pytest.log
            exit 1
          fi

  frontend-syntax:
    name: Frontend syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Tailwind, jsdom and axe-core from the lock file: npm ci installs exactly
      # what package-lock.json lists, checks every package against its integrity
      # hash, and fails when package.json and the lock file disagree. No package
      # runs an install script.
      - name: Install the Node tools
        run: |
          mkdir -p /tmp/tools
          cp .github/node-tools/package.json .github/node-tools/package-lock.json /tmp/tools/
          npm ci --prefix /tmp/tools --ignore-scripts --no-audit --no-fund

      - name: Syntax-check frontend scripts
        run: |
          for f in frontend/*.js; do
            node --check "$f"
          done
          node --test .github/tests/*.test.cjs

      # The Tailwind utilities are compiled once into a committed file instead of
      # in the browser; a class added to the markup without a rebuild would have
      # no style, so the build must reproduce the committed file exactly.
      - name: Utility CSS matches the markup
        run: |
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > /tmp/in.css
          /tmp/tools/node_modules/.bin/tailwindcss -c .github/tailwind/tailwind.config.cjs -i /tmp/in.css -o /tmp/utilities.css --minify
          if ! cmp -s /tmp/utilities.css frontend/assets/css/utilities.css; then
            echo "::error::frontend/assets/css/utilities.css is out of date; run: bash .github/scripts/build-utilities-css.sh"
            exit 1
          fi

      # In a real DOM: the shared drop-down (utils.js, uiPicker) after the WAI-ARIA
      # listbox and dialog patterns with axe-core, and the layers (router.js):
      # Escape, Back, focus and inert for dialogs and sheets
      - name: Accessibility of the pickers and the layers
        run: |
          A11Y_MODULES=/tmp/tools/node_modules node --test .github/tests/*.a11y.cjs

  image-smoke:
    name: Image build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          target: app
          tags: mailcow-logs-viewer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The regular image does not contain the demo package
        run: docker run --rm --entrypoint sh mailcow-logs-viewer:ci -c 'test ! -e /app/demo'

      - name: Boot the image against PostgreSQL and exercise it
        run: bash .github/scripts/smoke.sh mailcow-logs-viewer:ci

  demo-smoke:
    name: Demo image build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build demo image (amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          target: demo
          tags: mailcow-logs-viewer:ci-demo
          cache-from: |
            type=gha
            type=gha,scope=demo
          cache-to: type=gha,mode=max,scope=demo

      - name: Boot the demo image and check it is cut off from the network
        run: bash .github/scripts/demo_smoke.sh mailcow-logs-viewer:ci-demo
