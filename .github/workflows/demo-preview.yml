name: Build and Publish Demo Preview Image

# Publishes the public demo image of the latest merged work, so the hosted
# demo follows the product without a separate update. Runs on every push to
# the branch the work lands on (redesign/v3 until the v3 release, main after
# it); pushes to main only start it once this file is on main. A moving
# `demo-preview` tag plus an immutable `demo-preview-<sha>` tag to roll back
# to. It never touches `latest` or `demo`, which belong to releases
# (docker-publish.yml).
on:
  push:
    branches: [ redesign/v3, main ]
  workflow_dispatch:

env:
  GH_REGISTRY: ghcr.io

# Back-to-back merges publish only the newest build
concurrency:
  group: demo-preview
  cancel-in-progress: true

jobs:
  # A broken build must never reach the hosted demo
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build-and-push-demo-preview:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Mark the in-app version as a preview build
        # Same PEP 440 local-version form as docker-dev.yml (2.9.0+dev.abc1234),
        # so the demo shows which commit it runs
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          printf '%s+dev.%s' "$base" "${GITHUB_SHA::7}" > VERSION
          echo "Demo preview version: $(cat VERSION)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.GH_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for the demo preview image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.GH_REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=demo-preview
            type=sha,prefix=demo-preview-
          flavor: |
            latest=false

      - name: Build and push the demo preview image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          target: demo
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=demo-preview
          cache-to: type=gha,mode=max,scope=demo-preview
