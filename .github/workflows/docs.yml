# Documentation site on GitHub Pages.
#
# A pull request that touches the docs only builds the site (strict, so a
# broken link fails the check). A merge to main that touches the docs builds
# and publishes it. Runs only when the docs change, never on code-only changes.
name: Docs

on:
  pull_request:
    paths: &docs-paths
      - README.md
      - CHANGELOG.md
      - documentation/**
      - images/**
      - website/**
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths: *docs-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt

      # From the lock file (website/requirements.txt, generated from
      # website/requirements.in): only pinned packages with matching hashes,
      # only from wheels.
      - name: Install MkDocs
        run: |
          pip install --disable-pip-version-check \
            --require-hashes --no-deps --only-binary=:all: \
            -r website/requirements.txt
          pip check

      - name: Build the site
        run: |
          python website/stage.py
          mkdocs build --strict -f website/mkdocs.yml

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/.site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
